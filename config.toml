# Paths are relative to this file.
[branding]
event_name_long = "Great Dane Defense Competition"
event_name_short = "GDDC"
organization_name_long = "Cyber Defense Organization"
organization_name_short = "CDO"
logo_path = "dsss/assets/shield.png"

[engine]
host = "0.0.0.0"
port = 8080
target_round_time = 35
num_worker_processes = 32
database_path = "rounds.db"

[admin]
username = "admin"
password = "bb123#123"

[defaults]
timeout_seconds = 20
username = "scoring"
password = "scoring"

# Shared services are inherited by every team. Hosts expand team variables.

[[services]]
name = "Router SSH"
points = 10
[services.check]
type = "SSH"
host = "172.16.{subnet}.1"
port = 22
command = "echo scoring"
expected_output = "scoring"

[[services]]
name = "Router ICMP"
points = 10
[services.check]
type = "Ping"
host = "172.16.{subnet}.1"

[[services]]
